<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Ask the piano</title>
<link rel="stylesheet" href="style.css">
<script src="request.js" defer></script>
</head>
<body>
<main class="guest-page">
  <header class="guest-head">
    <p class="eyebrow">Steven Piano</p>
    <h1>Ask the piano</h1>
    <p class="note">Pick a piece. It joins the queue.</p>
    <p class="eyebrow">One request every five minutes</p>
  </header>
  <div id="catalogue"></div>
  <p class="empty" id="closed" hidden>Requests are closed right now.</p>
  <section class="guest-thanks" id="thanks" hidden aria-live="polite">
    <h2 class="display" id="thanks-title">Thanks — it's in the queue.</h2>
    <p class="note" id="thanks-piece"></p>
    <p class="eyebrow">One request every five minutes</p>
  </section>
  <p class="banner toast" id="guest-note" role="status" aria-live="polite" hidden></p>
</main>
</body>
</html>
