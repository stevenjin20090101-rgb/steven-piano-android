[versions]
androidGradlePlugin = "9.0.1"
kotlin = "2.3.20"
ksp = "2.3.12"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.03.01"
navigationCompose = "2.9.8"
room = "2.8.5"
datastore = "1.2.1"
media = "1.8.0"
coroutines = "1.10.2"
junit = "4.13.2"
orgJson = "20250517"
# Unit tests only: a real SQLite on the JVM, so the schema migrations run on a real database.
sqliteJdbc = "3.41.2.2"
# Unit tests only: a QR reader, so PosterTest proves the poster's code scans back to its address.
zxing = "3.5.4"
# Haze 1.7.2, the newest release built on this app's Compose (UI 1.10) and Kotlin (2.3): 2.0.0 and
# 1.7.3 need Compose UI 1.12, which requires compileSdk 37 and AGP 9.1 (BUILD_SPEC › v1.5 — M16).
haze = "1.7.2"
# The web panel (v1.5.1 — M18): NanoHTTPD and its WebSocket half (BSD-3-Clause), the QR code (MIT).
nanohttpd = "2.3.1"
qrcodeKotlin = "4.5.0"
# The piano's firmware updates (v1.6 — M21): Ed25519 checks below Android 13, whose platform has none (CC0).
eddsa = "0.3.0"
# Studio (v1.7 — M23): ONNX Runtime (MIT) runs the downloaded models on the tablet. Pinned at 1.28.0 and
# never 1.29.0 or newer: those add Microsoft's telemetry (a startup provider, ai.onnxruntime.TelemetryInitializer,
# that reports to v10.events.data.microsoft.com at every process start; docs/STUDIO_SPIKE.md). The build's
# checkOnnxTelemetry task (run by `check`) fails if a merged manifest ever carries it (BUILD_SPEC › v1.7 — M23).
onnxruntime = "1.28.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-windowsizeclass = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-media = { module = "androidx.media:media", version.ref = "media" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
# The glass of the floating controls (Apache-2.0); only ui/components/Glass.kt names it. In 1.x the
# blur is part of this artifact (2.0 splits it out as haze-blur).
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
# The web panel's server, and its WebSocket half (BSD-3-Clause); only web/ names them.
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { module = "org.nanohttpd:nanohttpd-websocket", version.ref = "nanohttpd" }
# The request poster's QR code (MIT): only its encoder is used (web/Poster.kt); Gradle picks the Android artifact, qrcode-kotlin-android.
qrcode-kotlin = { module = "io.github.g0dkar:qrcode-kotlin", version.ref = "qrcodeKotlin" }
# EdDSA-Java (CC0): checks a firmware release's Ed25519 signature where the platform can't; only firmware/Ed25519.kt names it.
eddsa = { module = "net.i2p.crypto:eddsa", version.ref = "eddsa" }
# Studio's runtime (MIT): arm64-v8a's native library only (app/build.gradle.kts); only studio/ names it.
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
# Unit tests only: the same runtime for the JVM (macOS and Linux), so TranscriberTest runs the real model where it is on disk.
onnxruntime-jvm = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
# Unit tests only: the real org.json on the JVM, where android.jar's is a stub (the update manifest is read with it).
org-json = { module = "org.json:json", version.ref = "orgJson" }
# Unit tests only: SQLite on the JVM (Apache-2.0), for SchemaV3Test's migration of a 1.4 database with its rows.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
# Unit tests only: ZXing's core reader (Apache-2.0), which decodes the QR codes the app draws.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
