[versions]
androidGradlePlugin = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
# v1.25 — M58: the AndroidX lines below are the newest that build on compileSdk 36. Core 1.19, Lifecycle 2.11, Navigation
# 2.10 and the Compose BOMs from 2026.08 (Compose UI 1.12) need compileSdk 37 (their AAR metadata): a later run moves
# compileSdk, and these with it. Until then lint's notices for them are kept quiet here, each with that reason.
#noinspection GradleDependency
androidxCore = "1.18.0"
#noinspection GradleDependency
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
#noinspection GradleDependency
androidxComposeBom = "2026.06.01"
#noinspection GradleDependency
navigationCompose = "2.9.8"
room = "2.8.5"
datastore = "1.3.0"
media = "1.8.0"
# A picked photo's EXIF orientation (v1.24 — M57: lint's ExifInterface; the platform's has known bugs on older Androids).
exifinterface = "1.4.2"
coroutines = "1.11.0"
junit = "4.13.2"
orgJson = "20260814"
# Unit tests only: a real SQLite on the JVM, so the schema migrations run on a real database.
sqliteJdbc = "3.53.4.0"
# Unit tests only: a QR reader, so PosterTest proves the poster's code scans back to its address.
zxing = "3.5.4"
# Haze 1.7.2, the newest release built on this app's Compose (UI 1.11 since v1.25) and compileSdk 36: 2.0 and 1.7.3 need
# Compose UI 1.12, which requires compileSdk 37 (BUILD_SPEC › v1.5 — M16, v1.25 — M58); 2.0 also splits out haze-blur.
#noinspection NewerVersionAvailable
haze = "1.7.2"
# The web panel (v1.5.1 — M18): NanoHTTPD and its WebSocket half (BSD-3-Clause), the QR code (MIT).
nanohttpd = "2.3.1"
qrcodeKotlin = "4.5.0"
# The piano's firmware updates (v1.6 — M21): Ed25519 checks below Android 13, whose platform has none (CC0).
eddsa = "0.3.0"
# Studio (v1.7 — M23): ONNX Runtime (MIT) runs the downloaded models on the tablet. Pinned at 1.28.0 and
# never 1.29.0 or newer: those add Microsoft's telemetry (a startup provider, ai.onnxruntime.TelemetryInitializer,
# that reports to v10.events.data.microsoft.com at every process start; docs/STUDIO_SPIKE.md). The build's
# checkOnnxTelemetry task (run by `check`) fails if a merged manifest ever carries it, or if the runtime resolves
# at any version but the pin in app/build.gradle.kts (onnxRuntimePinned): changing this line alone fails the build
# (BUILD_SPEC › v1.7 — M23; audit delta 2).
onnxruntime = "1.28.0"
# Steven Piano Cloud (v1.10 — M26): OkHttp's WebSocket client (Apache-2.0, with Okio) carries the tablet's one
# outbound connection to the relay: hostname verification by default, pings. Only web/relay/ names it; the
# updater and Wikipedia keep HttpURLConnection. Kept on 4.12.0 (v1.25 — M58): OkHttp 5 on Android adds an androidx-startup
# provider that runs at every process start, 5.5.0 needs compileSdk 37, and the relay's client wants its own review first.
#noinspection NewerVersionAvailable
okhttp = "4.12.0"
# The piano's Bluetooth lock (v1.25 — M58, firmware/docs/BLE_LOCK.md): Tink's pure-Java X25519 (Apache-2.0) for the
# claim's key agreement: Android's own "XDH" (Conscrypt) can't be relied on down to minSdk 26.
# Only piano/LockCrypto.kt names it; R8 keeps just what that file uses.
tink = "1.24.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-windowsizeclass = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-media = { module = "androidx.media:media", version.ref = "media" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
# The glass of the floating controls (Apache-2.0); only ui/components/Glass.kt names it. In 1.x the
# blur is part of this artifact (2.0 splits it out as haze-blur).
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
# The web panel's server, and its WebSocket half (BSD-3-Clause); only web/ names them.
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { module = "org.nanohttpd:nanohttpd-websocket", version.ref = "nanohttpd" }
# The request poster's QR code (MIT): only its encoder is used (web/Poster.kt); Gradle picks the Android artifact, qrcode-kotlin-android.
qrcode-kotlin = { module = "io.github.g0dkar:qrcode-kotlin", version.ref = "qrcodeKotlin" }
# EdDSA-Java (CC0): checks a firmware release's Ed25519 signature where the platform can't; only firmware/Ed25519.kt names it.
eddsa = { module = "net.i2p.crypto:eddsa", version.ref = "eddsa" }
# The relay's WebSocket client (Apache-2.0); only web/relay/ names it (v1.10 — M26).
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# X25519 for the piano's Bluetooth lock (Apache-2.0); only piano/LockCrypto.kt names it (v1.25 — M58).
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
# Studio's runtime (MIT): arm64-v8a's native library only (app/build.gradle.kts); only studio/ names it.
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
# Unit tests only: the same runtime for the JVM (macOS and Linux), so TranscriberTest runs the real model where it is on disk.
onnxruntime-jvm = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
# Unit tests only: the real org.json on the JVM, where android.jar's is a stub (the update manifest is read with it).
org-json = { module = "org.json:json", version.ref = "orgJson" }
# Unit tests only: SQLite on the JVM (Apache-2.0), for SchemaV3Test's migration of a 1.4 database with its rows.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
# Unit tests only: ZXing's core reader (Apache-2.0), which decodes the QR codes the app draws.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
